name: ReverseCAD
options:
  bundleIdPrefix: com.pranav
  deploymentTarget:
    iOS: '17.0'
packages:
  ReverseCADCore:
    path: ../packages/ReverseCADCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9ZZ88Z7G7B
targets:
  ReverseCAD:
    type: application
    platform: iOS
    sources:
      - path: ReverseCAD
        excludes: [SampleScan, Info.plist, Prelude-Info.plist]
      - path: ReverseCAD/SampleScan
        type: folder
        optional: true
    dependencies:
      - package: ReverseCADCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sivasaran.reversecad.trial
        INFOPLIST_FILE: ReverseCAD/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  PreludeScanner:
    type: application
    platform: iOS
    sources:
      - path: ReverseCAD
        excludes: [SampleScan, Info.plist, Prelude-Info.plist]
      - path: ReverseCAD/SampleScan
        type: folder
        optional: true
      - path: PrivateResources/PreludeJevConfig.plist
        buildPhase: resources
        optional: true
    dependencies:
      - package: ReverseCADCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranavmuralitharan.prelude
        PRODUCT_NAME: Prelude
        DEVELOPMENT_TEAM: 5B3Y68ZB2Y
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PRELUDE_SCANNER
        INFOPLIST_FILE: ReverseCAD/Prelude-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '29'
  ReverseCADSparseResearch:
    type: application
    platform: iOS
    sources:
      - path: ReverseCAD
        excludes: [SampleScan, Info.plist, Prelude-Info.plist]
      - path: ReverseCAD/SampleScan
        type: folder
        optional: true
      - path: ../research/sparse-capture
    dependencies:
      - package: ReverseCADCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranav.reversecad.sparse
        PRODUCT_NAME: ReverseCADSparseResearch
        SWIFT_OBJC_BRIDGING_HEADER: ../research/sparse-capture/Bridging.h
        DEVELOPMENT_TEAM: 5B3Y68ZB2Y
        SKIP_INSTALL: YES
        INFOPLIST_FILE: ReverseCAD/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG SPARSE_RESEARCH
          GCC_PREPROCESSOR_DEFINITIONS: $(inherited) DEBUG=1 SPARSE_RESEARCH=1
    preBuildScripts:
      - name: Debug research only
        script: 'if [ "$CONFIGURATION" != Debug ] || [ "$ACTION" = install ]; then echo "error: Private sensor research cannot be archived or distributed"; exit 1; fi'
        basedOnDependencyAnalysis: false
  ReverseCADTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ReverseCADTests]
    dependencies:
      - target: ReverseCAD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranav.ReverseCADTests
        GENERATE_INFOPLIST_FILE: YES
  ReverseCADUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReverseCADUITests]
    dependencies:
      - target: ReverseCAD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranav.ReverseCADUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ReverseCAD:
    build:
      targets:
        ReverseCAD: all
        ReverseCADUITests: [test]
        ReverseCADTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ReverseCADUITests
        - ReverseCADTests
  ReverseCADSparseResearch:
    build:
      targets:
        ReverseCADSparseResearch: all
    run:
      config: Debug
  PreludeScanner:
    build:
      targets:
        PreludeScanner: all
    run:
      config: Debug
