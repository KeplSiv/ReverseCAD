name: ReverseCAD
options:
  bundleIdPrefix: com.pranav
  deploymentTarget:
    iOS: '17.0'
packages:
  ReverseCADCore:
    path: ../packages/ReverseCADCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5B3Y68ZB2Y
targets:
  ReverseCAD:
    type: application
    platform: iOS
    sources:
      - path: ReverseCAD
        excludes: [SampleScan]
      - path: ReverseCAD/SampleScan
        type: folder
        optional: true
    dependencies:
      - package: ReverseCADCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranav.ReverseCAD
        INFOPLIST_FILE: ReverseCAD/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  ReverseCADTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ReverseCADTests]
    dependencies:
      - target: ReverseCAD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranav.ReverseCADTests
        GENERATE_INFOPLIST_FILE: YES
  ReverseCADUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReverseCADUITests]
    dependencies:
      - target: ReverseCAD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranav.ReverseCADUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ReverseCAD:
    build:
      targets:
        ReverseCAD: all
        ReverseCADUITests: [test]
        ReverseCADTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ReverseCADUITests
        - ReverseCADTests
